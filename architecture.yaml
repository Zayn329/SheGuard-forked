# =============================================================================
# architecture.yaml
# =============================================================================
# Product: SheGuard
# Team: Aegis
# Problem Statement: CX1001 (teamAegis_CX1001_codex2026)
# Domain: Women Safety & Social Impact — Preventive & Community Safety
#
# Purpose:
#   Root architecture contract for an agent-assisted implementation harness.
#   Aligned with the canonical product contract defined in docs/SHEGUARD_PRD.md.
#
# Offline-First Hierarchy:
#   1. LOCAL OPERATION (Fundamental Guarantee): Local report creation, Room
#      persistence, local pattern detection, trust evaluation, and alert generation.
#   2. MESH COMMUNICATION (MVP Capability): BLE / Wi-Fi Direct peer-to-peer relay
#      for disconnected nearby participating devices.
#   3. BACKEND SYNCHRONIZATION (Supporting Capability): Asynchronous sync when
#      Internet connectivity returns.
# =============================================================================

version: "2.1"

project:
  name: "SheGuard"
  team: "Aegis"
  problem_statement: "CX1001"
  repository_model: monorepo
  primary_platform: android

  goal: >
    An offline-first intelligent safety system that converts low-friction,
    anonymous micro-reports into verified spatio-temporal risk patterns and
    actionable community-level early warnings using local operation and BLE /
    Wi-Fi Direct mesh relay without relying on cloud connectivity or LLMs.

  primary_design_principle: >
    The fundamental local pipeline (Report -> Local Persistence -> Detect -> Trust -> Alert)
    must remain fully operational on-device without requiring Internet connectivity,
    backend availability, mesh peers, or LLM services. Mesh communication enhances
    local context by propagating compact reports and pattern signals between nearby
    devices without becoming a hard prerequisite for local operation.

  implementation_target: >
    A genuinely functional hackathon implementation with real Android services,
    sensors, local Room storage, pattern engine, trust evaluator, Google Nearby
    Connections mesh relay, and optional supporting backend paths.

# -----------------------------------------------------------------------------
# ARCHITECTURAL INVARIANTS
# -----------------------------------------------------------------------------

invariants:

  offline_first_local_guarantee:
    rule: >
      SheGuard does not require Internet or backend connectivity to create,
      propagate, process, trust, or act on safety signals. Local operation is
      the fundamental guarantee.
    applies_to:
      - micro_report_creation
      - local_persistence
      - spatio_temporal_pattern_detection
      - trust_and_anti_gaming_evaluation
      - rising_pattern_alert_generation
      - store_and_forward_queuing

  mesh_mvp_capability_degradation_boundary:
    rule: >
      BLE / Wi-Fi Direct mesh relay is an MVP communication capability that
      allows nearby disconnected devices to exchange safety signals. Mesh
      enhances the shared local safety picture, but mesh failure or absence
      of nearby peer devices MUST NOT break local report creation, local persistence,
      local pattern detection, or local early-warning alerting.
    applies_to:
      - mesh_relay
      - peer_to_peer_packet_propagation

  deterministic_mvp_pipeline:
    rule: >
      No LLM, generative AI, or agent component may participate in micro-report validation,
      spatio-temporal pattern detection, trust scoring, anti-gaming checks,
      mesh forwarding decisions, or early-warning alert generation.

  anti_gaming_trust_rule:
    rule: >
      Raw report volume alone MUST NOT cause a pattern confidence escalation or
      trigger an early-warning alert. Trust evaluation requires reporter diversity,
      temporal independence, and spatial consistency.

  user_privacy_and_control:
    rule: >
      Micro-reports are anonymous by default. Micro-reports must not contain or
      require personally identifying user information or continuous exact location
      tracking.

  graceful_degradation:
    rule: >
      Supporting capabilities (evidence capture, backend sync, legal AI) and peer
      transports (mesh) must fail independently without disrupting the core local
      reporting, pattern detection, or early-warning alert flow.

# -----------------------------------------------------------------------------
# SYSTEM BOUNDARIES
# -----------------------------------------------------------------------------

system_boundaries:

  android_device:
    trust_level: trusted_execution_environment
    owns:
      - micro_report_creation
      - local_report_persistence
      - local_spatio_temporal_pattern_detection
      - deterministic_trust_evaluation
      - local_rising_pattern_alert_generation
      - ble_wifi_direct_mesh_transport
      - store_and_forward_queuing
      - optional_sensor_processing
      - optional_evidence_capture_and_encryption
      - local_audit_log

  backend:
    trust_level: authenticated_remote_service
    owns:
      - optional_report_metadata_sync
      - aggregated_pattern_sync
      - optional_legal_drafting_requests
      - optional_integrity_anchoring

    must_not_require_for:
      - micro_report_creation
      - local_persistence
      - mesh_relay
      - local_pattern_detection
      - local_trust_scoring
      - local_early_warning_alerts

  external_ai_provider:
    trust_level: untrusted_external_processing_boundary
    permitted_data:
      - explicitly_authorized_structured_report_summaries
      - aggregated_pattern_metadata
    prohibited_data_by_default:
      - raw_audio
      - exact_user_location_history
      - unencrypted_evidence

# -----------------------------------------------------------------------------
# REPOSITORY STRUCTURE
# -----------------------------------------------------------------------------

repository:

  root: .

  directories:

    android:
      path: android/
      purpose: >
        Native Kotlin Android application containing UI, micro-reporting,
        pattern engine, trust evaluator, local persistence, Google Nearby Connections
        mesh relay, and supporting safety services.

    backend:
      path: backend/
      purpose: >
        Minimal FastAPI service for optional online pattern aggregation,
        metadata sync, and AI legal/summary drafting.

    specs:
      path: docs/specs/
      purpose: Focused architecture specifications.

    bdd:
      path: bdd/
      purpose: Behaviour specifications and acceptance scenarios.

    docs:
      path: docs/
      purpose: SheGuard product PRD, architecture, API, and ADR documentation.

# -----------------------------------------------------------------------------
# TECHNOLOGY DECISIONS
# -----------------------------------------------------------------------------

technology:

  android:
    language: Kotlin
    ui: Jetpack Compose

    architecture:
      style: clean_architecture_with_feature_modules
      presentation_pattern: MVVM
      asynchronous_execution:
        - Kotlin Coroutines
        - Flow

    persistence:
      primary:
        technology: Room
        database: SQLite
      encrypted_files:
        technology: Android application-private storage

    background_execution:
      pattern_monitor:
        technology: Android Foreground Service / WorkManager
        requirement: Must operate reliably offline.

    cryptography:
      hardware_keys: Android Keystore
      hashing: SHA-256
      evidence_encryption: AES-256-GCM

    mesh:
      primary: Google Nearby Connections
      transports:
        - BLE
        - WiFi_Direct
      capabilities:
        - peer_discovery
        - compact_report_packet_forwarding
        - store_and_forward
        - deduplication_cache
        - hop_limit_enforcement

  backend:
    language: Python
    framework: FastAPI
    validation: Pydantic

    persistence:
      primary: PostgreSQL
      local_development_option: PostgreSQL_or_SQLite

    ai:
      provider_strategy: provider_abstraction
      supported_provider_categories:
        - Groq
        - local_model

# -----------------------------------------------------------------------------
# HIGH LEVEL COMPONENTS
# -----------------------------------------------------------------------------

components:

  # --- CORE SHEGUARD MVP COMPONENTS ---

  micro_reporter:
    location: android
    criticality: mvp_core
    responsibility: >
      Provides low-friction, anonymous safety micro-reporting UI and local queuing
      for incident/hazard categories (e.g., poor lighting, harassment, feeling followed).

  spatio_temporal_pattern_engine:
    location: android_and_backend
    criticality: mvp_core
    responsibility: >
      Aggregates micro-reports (local and mesh-received) within spatial proximity
      (e.g., geohash / distance radius) and temporal windows (e.g., 30m / 2h)
      to identify emerging risk patterns.

  trust_and_anti_gaming_evaluator:
    location: android_and_backend
    criticality: mvp_core
    responsibility: >
      Evaluates report confidence based on reporter diversity, temporal independence,
      spatial consistency, duplicate filtering, and rate-limiting anti-flooding checks.
    invariant: >
      Raw report count alone MUST NOT trigger a pattern escalation.

  rising_pattern_alert_engine:
    location: android
    criticality: mvp_core
    responsibility: >
      Surfaces verified emerging risk patterns as actionable early-warning alerts
      containing spatial/temporal context and risk category.

  # --- MVP COMMUNICATION CAPABILITY ---

  mesh_relay:
    location: android
    criticality: mvp_mesh_communication
    responsibility: >
      Relays compact, privacy-minimized micro-reports and pattern alerts peer-to-peer
      via Google Nearby Connections (BLE / Wi-Fi Direct) between nearby participating
      devices without Internet connectivity.
    requirements:
      - store_and_forward_semantics
      - packet_deduplication_cache
      - hop_count_limit_enforcement
      - local_persistence_before_relay
      - graceful_degradation_if_no_peers_found
      - no_internet_requirement

  # --- SUPPORTING / REUSABLE INFRASTRUCTURE COMPONENTS ---

  evidence_engine:
    location: android
    criticality: supporting
    responsibility: >
      Captures, encrypts (AES-256-GCM), hashes (SHA-256), and Merkle-seals optional
      incident evidence locally on-device.

  notify_circle:
    location: android_and_backend
    criticality: supporting_legacy
    responsibility: >
      Optional trusted contacts management and alert fan-out.

  legal_agent:
    location: backend
    criticality: supporting_optional
    responsibility: >
      Converts structured incident/report data into FIR/complaint drafts with mandatory legal disclaimer.

# -----------------------------------------------------------------------------
# SHEGUARD DATA & COMMUNICATION FLOW
# -----------------------------------------------------------------------------

data_and_communication_flow:
  concept: >
    Local persistence and local detection form the fundamental guarantee.
    Mesh communication operates alongside local persistence to exchange
    reports with nearby devices. Backend sync occurs asynchronously when
    Internet is restored.

  diagram: >
    [ Anonymous Report ] -> [ Local Persistence (Room) ] -> [ Local Detect / Trust / Alert ] <--> [ BLE / Wi-Fi Direct Mesh Relay ] -> [ Optional Backend Sync (when online) ]

# -----------------------------------------------------------------------------
# SHEGUARD REPORT & PATTERN LIFECYCLE STATE MACHINE
# -----------------------------------------------------------------------------

reporting_pattern_state_machine:

  report_states:
    - created
    - stored_locally
    - mesh_queued
    - mesh_relayed
    - validated
    - contributing_to_pattern
    - synced

  pattern_states:
    - inactive
    - pattern_candidate
    - trust_evaluating
    - pattern_emerging
    - alert_active
    - resolved
    - archived

  transitions:

    report_creation:
      trigger: user_submits_micro_report
      actions:
        - save_locally_room
        - assign_anonymous_token
        - queue_for_pattern_evaluation
        - queue_for_mesh_relay_if_enabled

    mesh_relay_propagation:
      trigger: nearby_peers_discovered
      actions:
        - forward_compact_packet_over_ble_or_wifi_direct
        - update_packet_hop_count
        - record_deduplication_hash

    pattern_evaluation:
      trigger: spatio_temporal_proximity_detected
      condition: report_count_and_spatial_window_met
      next_state: pattern_candidate

    trust_validation:
      trigger: evaluate_trust_signals
      conditions:
        - reporter_diversity_score_above_threshold
        - temporal_independence_verified
        - duplicate_flooding_check_passed
      success_state: pattern_emerging
      failure_state: pattern_candidate

    alert_generation:
      trigger: pattern_emerging
      actions:
        - generate_rising_pattern_alert
        - notify_local_user
        - broadcast_via_mesh_if_enabled

# -----------------------------------------------------------------------------
# DATA MODELS
# -----------------------------------------------------------------------------

data_models:

  MicroReport:
    fields:
      report_id: uuid
      anonymous_reporter_token: string
      category: enum # poor_lighting, harassment, feeling_followed, unsafe_gathering, suspicious_activity
      latitude: number_nullable
      longitude: number_nullable
      approximate_area: string
      timestamp: timestamp
      context_description: string_nullable
      sync_status: enum # local, mesh_queued, synced

  MeshPacket:
    fields:
      packet_id: uuid
      report_id: uuid
      payload_type: enum # micro_report, pattern_alert
      created_at: timestamp
      hop_count: integer
      max_hops: integer # default: 12
      payload_hash: string
      compact_payload: bytes

  SpatioTemporalPattern:
    fields:
      pattern_id: uuid
      center_latitude: number
      center_longitude: number
      radius_meters: number
      category: enum
      first_reported_at: timestamp
      last_reported_at: timestamp
      report_count: integer
      trust_score: number
      state: enum # candidate, emerging, alert_active, resolved

  RisingPatternAlert:
    fields:
      alert_id: uuid
      pattern_id: uuid
      category: enum
      approximate_location: string
      time_window: string
      trust_level: string # low, medium, high
      created_at: timestamp
      disclaimer: string # "EARLY WARNING PATTERN ALERT. NOT A GUARANTEED EMERGENCY RESPONSE."

# -----------------------------------------------------------------------------
# EVENT CONTRACTS
# -----------------------------------------------------------------------------

events:

  naming:
    style: domain.past_tense

  core_mvp:
    - report.created
    - report.stored_locally
    - report.validated
    - report.rejected
    - pattern.candidate_detected
    - pattern.trust_evaluated
    - pattern.emerging
    - alert.generated

  mvp_mesh_communication:
    - mesh.peer_discovered
    - mesh.packet_queued
    - mesh.packet_relayed
    - mesh.packet_received
    - mesh.duplicate_dropped

  supporting:
    - evidence.captured
    - evidence.sealed
    - sync.completed

# -----------------------------------------------------------------------------
# FAILURE HANDLING & DEGRADATION
# -----------------------------------------------------------------------------

failure_modes:

  network_unavailable:
    expected_behavior:
      - save_micro_report_locally
      - run_local_pattern_and_trust_evaluator
      - relay_via_ble_wifi_direct_mesh_if_peers_present
      - queue_for_backend_sync_when_connectivity_returns

  mesh_unavailable_or_no_peers:
    expected_behavior:
      - save_micro_report_locally
      - run_local_pattern_and_trust_evaluator
      - queue_mesh_packets_locally_without_error
      - local_reporting_and_alerting_unaffected

  backend_unavailable:
    expected_behavior:
      - core_reporting_mesh_and_alerting_unaffected
      - sync_queued_until_reconnected

  ai_provider_unavailable:
    expected_behavior:
      - legal_drafting_unavailable
      - micro_reporting_mesh_and_pattern_alerts_unaffected

# -----------------------------------------------------------------------------
# PRIVACY AND PERMISSIONS
# -----------------------------------------------------------------------------

privacy:

  defaults:
    anonymous_reporting: enabled_by_default
    continuous_location_tracking: disabled
    raw_evidence_upload: disabled

  principles:
    - data_minimization
    - anonymous_by_default
    - local_first

# -----------------------------------------------------------------------------
# IMPLEMENTATION PRIORITY
# -----------------------------------------------------------------------------

implementation_priority:

  phase_1_sheguard_mvp:
    required:
      - micro_report_ui_and_room_persistence
      - google_nearby_connections_mesh_relay
      - spatio_temporal_pattern_engine
      - trust_and_anti_gaming_evaluator
      - rising_pattern_alert_display

  phase_2_supporting_infrastructure:
    required:
      - local_evidence_encryption_and_merkle_sealing
      - fastapi_backend_pattern_sync

  phase_3_extended:
    optional:
      - legal_ai_drafting_agent
      - integrity_anchoring
